name: Pull Request Validation

# Tests of both modules on every PR. Publishing is the workflow "Release".
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the version extension needs them
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check no version is written by hand
        run: .github/scripts/check-version-unchanged.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean install

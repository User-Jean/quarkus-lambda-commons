quarkus:
  devservices:
    enabled: false
  log:
    category:
      "com.example.app":
        level: ERROR
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss.SSSZ} %-5p [%c] (%t) %s%e%n"
      json:
        enabled: false

  hibernate-orm:
#    log:
#      sql: true

  # H2 in MySQL mode: the migrations keep the MySQL syntax
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa

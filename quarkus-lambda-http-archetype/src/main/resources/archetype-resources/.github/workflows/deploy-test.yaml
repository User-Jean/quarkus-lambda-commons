name: Deploy to test

# Creates the next version vX.Y.Z from develop and deploys it to <name>-test (metadata.name of deploy/base.yaml). Only
# on demand: nothing is deployed on push. If the deploy fails, "Re-run failed jobs" deploys the same version again.
# The steps are in quarkus-lambda-commons, with the same version as the parent of pom.xml:
# https://github.com/User-Jean/quarkus-lambda-commons#workflows-de-las-lambdas
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump from the last tag v*'
        required: true
        type: choice
        default: patch
        options: [ patch, minor, major ]
      description:
        description: 'What this version changes (tag message, release notes and Lambda version description)'
        required: true
        type: string

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    uses: User-Jean/quarkus-lambda-commons/.github/workflows/lambda-deploy-test.yaml@vQUARKUS_LAMBDA_COMMONS_VERSION
    permissions:
      contents: write
      id-token: write
    with:
      bump: ${{ inputs.bump }}
      description: ${{ inputs.description }}
      # Repository variables (Settings → Secrets and variables → Actions → Variables)
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      artifacts-bucket: ${{ vars.LAMBDA_ARTIFACTS_BUCKET }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

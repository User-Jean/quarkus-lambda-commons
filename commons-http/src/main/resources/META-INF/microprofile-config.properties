# Defaults of the library: the application.yaml of the app overrides them. The apps log only ERROR outside their
# own package, so without this the bodies and the 4xx of the library wouldn't be logged
quarkus.log.category."com.xdyan.commons".level=INFO
# A null field is not written in the response (an empty list still is): no "x": null. A field that can be missing is
# optional in the openapi.yaml, not required + nullable. An app that needs the nulls sets
# quarkus.jackson.serialization-inclusion: always
quarkus.jackson.serialization-inclusion=non_null
